{% extends "base.html" %}
{% block title %}Choose a new password · {{ SITE_NAME }}{% endblock %}
{% block main_class %}page page--narrow{% endblock %}

{% block content %}
<div class="auth-card panel">
  <div class="panel__head"><span class="panel__title">Choose a new password</span></div>
  <div class="panel__body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field-label" for="password">New password</label>
        <input class="input" type="password" id="password" name="password" required
               minlength="8" autocomplete="new-password" autofocus>
        <p class="field-hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label class="field-label" for="confirm">Confirm password</label>
        <input class="input" type="password" id="confirm" name="confirm" required
               minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn--primary btn--block" type="submit">Set password</button>
    </form>
  </div>
</div>
{% endblock %}
