{% extends "base.html" %}
{% block title %}Sign in · {{ SITE_NAME }}{% endblock %}
{% block main_class %}page page--narrow{% endblock %}

{% block content %}
<div class="auth-card panel">
  <div class="panel__head"><span class="panel__title">Sign in</span></div>
  <div class="panel__body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email" autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required
               autocomplete="current-password">
      </div>
      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
    </form>
    <p class="auth-alt">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </p>
    <p class="auth-alt">
      No account? <a href="{{ url_for('auth.register') }}">Sign up</a> — it takes a moment
      and lets you post a report.
    </p>
  </div>
</div>
{% endblock %}
