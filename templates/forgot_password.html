{% extends "base.html" %}
{% block title %}Reset your password · {{ SITE_NAME }}{% endblock %}
{% block main_class %}page page--narrow{% endblock %}

{% block content %}
<div class="auth-card panel">
  <div class="panel__head"><span class="panel__title">Reset your password</span></div>
  <div class="panel__body">
    <p class="muted">Enter your email and we'll send a link to choose a new password.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email" autofocus>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
    </form>
    <p class="auth-alt"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
